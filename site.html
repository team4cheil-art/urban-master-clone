<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>대상지 확인 · marspace</title>
<link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="pj pj--landing">
  <header class="pj-top">
    <div class="pj-wrap pj-top-in">
      <a class="pj-brand" href="index.html">
        <span class="pj-logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5v10l-10 5-10-5V7l10-5Zm0 10 10-5M12 12 2 7m10 5v10"></path></svg></span>
        <span>marspace<small>Mapping · Analysis · Regulation · Strategy</small></span>
      </a>
      <div class="pj-top-right">
        <a class="pj-help" href="help.html">도움말</a>
        <a class="pj-user" href="mypage.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-3.6 4.4-5.5 8-5.5s6.5 1.9 8 5.5"></path></svg></a>
      </div>
    </div>
  </header>
  <main class="pj-main">
    <div class="rv-wrap">
      <a href="index.html" class="pj-back">← 대상지 다시 찾기</a>
      <p class="rv-status" style="margin-top:14px">주소 검색 결과</p>
      <div class="rv--found">
        <span class="rv-cap">카카오 로컬 결과</span>
        <div class="rv-addr" id="rv-addr">불러오는 중…</div>
        <dl class="rv-facts">
          <div><dd id="rv-lat">-</dd><dt>위도</dt></div>
          <div><dd id="rv-lng">-</dd><dt>경도</dt></div>
        </dl>
        <p class="rv-note">실제 지적경계·면적·용도지역 규제 조회는 대상지 워크스페이스에서 이어집니다. 이 클론에서는 예시 데이터로 대체된 화면입니다.</p>
        <div class="rv-actions">
          <a class="rv-go" href="workspace.html">워크스페이스로 계속하기 →</a>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const params = new URLSearchParams(location.search);
  let stored = null;
  try { stored = JSON.parse(sessionStorage.getItem("um-last-search") || "null"); } catch (e) {}
  const addr = params.get("q") || (stored && stored.refined) || "주소 정보 없음";
  document.getElementById("rv-addr").textContent = addr;
  if (stored && stored.point) {
    document.getElementById("rv-lat").textContent = Number(stored.point.y).toFixed(5);
    document.getElementById("rv-lng").textContent = Number(stored.point.x).toFixed(5);
  }
</script>
</body>
</html>
